---
# ecx01_install.yml
#
# ECX01 Raspberry Pi provisioning.
#
# Application source : gitlab software/modbus_slf01
#                      branch master
#                      commit 2531c85167167d6701930dcc2447a18e32dbe375
#                      vendored verbatim into ./bin/modbus_ecx01/
#                      (config.py deliberately NOT vendored - see conf/config.py.j2)
# Entry point        : modbus.py -> class ECX01_Uploader
# Serial devices     : /dev/inverter, /dev/bms
#                      (see conf/98-ecx01.rules)
# ==============================================================
# Play 1 - Docker Container verification
# ==============================================================
- name: Ansible Docker Test
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:

    - name: Check container hostname
      ansible.builtin.command:
        cmd: hostname
      register: docker_hostname
      changed_when: false

    - name: Print container hostname
      ansible.builtin.debug:
        msg: "Docker Container hostname = {{ docker_hostname.stdout }}"

    - name: Check Ansible version
      ansible.builtin.command:
        cmd: ansible-playbook --version
      register: ansible_version_result
      changed_when: false

    - name: Print Ansible version
      ansible.builtin.debug:
        var: ansible_version_result.stdout_lines

    - name: Docker verification PASS
      ansible.builtin.debug:
        msg: "Ansible task 已成功在 Docker Container 裡執行"